<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhoPaid?</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>WhoPaid?</h1>
    <p>See who paid and who owes.</p>

    <h2>Create a group</h2>

    <form id="group-form">
      <label for="group-name">Group name</label>
      <input type="text" id="group-name" required />

      <label for="people">People (seperated by commas)</label>
      <input type="text" id="people" placeholder="Ali, Salma, Omar" required />

      <button type="submit">Create group</button>
    </form>
    <div id="group-info"></div>

    <section id="expenses-section" hidden>
      <h2>Add expense</h2>

      <form id="expense-form">
        <label for="expense-name">What was it for?</label>
        <input type="text" id="expense-name" required />

        <label for="expense-amount">Amount</label>
        <input
          type="number"
          id="expense-amount"
          min="0.01"
          step="0.01"
          required
        />

        <label for="expense-category">Category</label>
        <select id="expense-category">
          <option>Food</option>
          <option>Transport</option>
          <option>Stay</option>
          <option>Shopping</option>
          <option>Other</option>
        </select>

        <label for="paid-by">Who paid?</label>
        <select id="paid-by" required></select>

        <button type="submit">Add expense</button>

        <button type="button" id="cancel-edit" hidden>Cancel edit</button>
      </form>

      <h2>Expenses</h2>

      <label for="expense-search">Search expenses</label>
      <input type="search" id="expense-search" placeholder="Name or person" />

      <label for="category-filter">Show category</label>
      <select id="category-filter">
        <option value="All">All categories</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Stay</option>
        <option>Shopping</option>
        <option>Other</option>
      </select>

      <label for="expense-sort">Sort expenses</label>
      <select id="expense-sort">
        <option value="added">Added order</option>
        <option value="highest">Highest amount first</option>
        <option value="lowest">Lowest amount first</option>
      </select>
      <ul id="expense-list"></ul>
      <p id="expenses-message" role="status"></p>

      <p>Total spent: <strong id="total-spent">0.00</strong></p>

      <h2>Spending by category</h2>
      <ul id="category-totals"></ul>

      <h2>Balances</h2>
      <ul id="balances-list"></ul>

      <h2>Who pays whom?</h2>
      <ul id="payments-list"></ul>
      <button type="button" id="download-backup">Download backup</button>
      <label for="restore-backup">Restore a backup</label>
      <input type="file" id="restore-backup" accept=".json,application/json" />
      <p id="backup-message" role="status"></p>
    </section>
    <script src="script.js"></script>
  </body>
</html>
